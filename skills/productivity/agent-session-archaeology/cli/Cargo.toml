[package]
name = "sarch"
version = "0.1.0"
edition = "2021"
description = "Offline agent-session discovery and evidence-backed guide maintenance"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
flate2 = "1"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zstd = "0.13"

[profile.release]
strip = true
lto = "thin"
